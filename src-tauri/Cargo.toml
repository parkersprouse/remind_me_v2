[package]
name = "remind_me"
version = "1.9.0"
description = "Remind Me! is an app to help you quickly and easily set reminders to make sure you always remember what you need to."
authors = ["Parker Sprouse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remind_me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Debug builds ship an unstripped .so that pushes the APK past what the
# emulator's data partition can hold; the debuginfo is useless on-device.
[profile.dev]
strip = "debuginfo"

# Release: strip all symbols and optimize for size. The shipped `.so` needs no
# symbols on-device, and this keeps the distributed release APK small.
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-safe-area-insets-css = "0.2"

# Vendored with a one-line Kotlin fix: upstream 2.3.3 stores notification
# action buttons under the wrong SharedPreferences keys, so every action
# renders with an empty title and reports an empty action id when tapped
# (see android/src/main/java/NotificationStorage.kt in the vendored copy).
[patch.crates-io]
tauri-plugin-notification = { path = "vendored/tauri-plugin-notification" }

